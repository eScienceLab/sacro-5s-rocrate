[project]
name = "sacro_5s_crate"
version = "0.0.1"
authors = [
  { name = "Douglas Lowe", email = "douglas.lowe@manchester.ac.uk" },
]
description = "Tooling for creating a SACRO 5-Safes RO-Crate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
